<!doctype html>
<html lang="en">

<head>
  <title>TF Web</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 预加载字体文件，防止页面字体闪烁 -->
  <link rel="preload" href="/webFonts/SourceHanSansSC-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="preload" href="/webFonts/SourceHanSansSC-Medium.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="preload" href="/webFonts/SourceHanSansSC-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
</head>



<style>
  @font-face {
    font-family: "HanSans";
    src: url('/webFonts/SourceHanSansSC-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }

  @font-face {
    font-family: "HanSans";
    src: url('/webFonts/SourceHanSansSC-Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
  }

  @font-face {
    font-family: "HanSans";
    src: url('/webFonts/SourceHanSansSC-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --font-primary: "HanSans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
  }
</style>

<script>
  window.appId = 'WEB';
  window.extraConfig = {};
</script>

<script src="/config.js"></script>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
